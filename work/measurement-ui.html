<style>
#measurement-mock {--m-bg:light-dark(#fff,#192128);--m-text:light-dark(#182a36,#e4edf2);--m-sub:light-dark(#526773,#b2c3ce);--m-line:light-dark(#d9e3e9,#40525e);--m-soft:light-dark(#f3f7fa,#23323d);--m-accent:light-dark(#125b77,#9cdbef);--m-on:light-dark(#fff,#102b36);--m-error:light-dark(#a13232,#ffb6b6);color:var(--m-text);font:14px/1.6 system-ui,sans-serif;background:var(--m-bg);border:1px solid var(--m-line);border-radius:14px;overflow-wrap:anywhere;}
#measurement-mock * {box-sizing:border-box} #measurement-mock header {padding:20px 24px;border-bottom:1px solid var(--m-line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap} #measurement-mock h2,#measurement-mock h3,#measurement-mock p {margin:0} #measurement-mock h2 {font-size:20px;font-weight:500} #measurement-mock h3 {font-size:16px;font-weight:500} #measurement-mock .m-sub {color:var(--m-sub)} #measurement-mock .m-body {padding:24px;display:grid;gap:24px} #measurement-mock label {display:grid;gap:6px} #measurement-mock input,#measurement-mock textarea,#measurement-mock select {width:100%;min-width:0;font:inherit;color:var(--m-text);background:var(--m-bg);border:1px solid var(--m-line);border-radius:7px;padding:9px 10px} #measurement-mock button {font:inherit;border:1px solid var(--m-line);border-radius:7px;padding:8px 12px;background:var(--m-bg);color:var(--m-text);cursor:pointer} #measurement-mock button:disabled {opacity:.55;cursor:default} #measurement-mock .m-primary {background:var(--m-accent);color:var(--m-on);border-color:var(--m-accent)} #measurement-mock .m-heading {display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px} #measurement-mock .m-grid {display:grid;grid-template-columns:1fr 1fr;gap:20px} #measurement-mock .m-conditions {background:var(--m-soft);border-radius:10px;padding:18px;display:grid;gap:14px} #measurement-mock .m-pair {display:grid;grid-template-columns:1fr 1fr;gap:10px} #measurement-mock .m-url {display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--m-line)} #measurement-mock .m-row {display:flex;align-items:center;gap:8px;flex-wrap:wrap} #measurement-mock .m-row input {flex:1;min-width:160px} #measurement-mock .m-pill {padding:2px 8px;border-radius:5px;background:var(--m-soft);font-size:12px} #measurement-mock .m-error {color:var(--m-error)} #measurement-mock .m-result {border-top:1px solid var(--m-line);padding:14px 0;display:grid;gap:4px} #measurement-mock .m-result button {justify-self:start} #measurement-mock .m-actions {display:flex;gap:10px;align-items:center;flex-wrap:wrap} #measurement-mock .m-flow {display:flex;gap:8px;flex-wrap:wrap;color:var(--m-sub);padding:12px 0} #measurement-mock footer {border-top:1px solid var(--m-line);padding:16px 24px} #measurement-mock [hidden] {display:none!important} @media(max-width:620px) {#measurement-mock .m-grid {grid-template-columns:1fr} #measurement-mock .m-body {padding:16px} #measurement-mock header {padding:16px} #measurement-mock .m-pair {grid-template-columns:1fr} #measurement-mock input {font-size:16px}} @media(pointer:coarse) {#measurement-mock button {min-height:44px}}
</style>
<div id="measurement-mock" aria-label="計測設定のUI検討案">
<header><div><div class="m-sub">Price Monitoring / 計測設定</div><h2>iPhone 15を計測</h2></div><span class="m-pill">操作できるUI案・サンプルデータ</span></header>
<div class="m-body">
<label>計測名<input id="m-name" value="iPhone 15 中古相場"></label>
<div class="m-grid" id="m-layout">
<section aria-label="取得URL"><div class="m-heading"><h3>取得URL</h3><span class="m-sub" id="m-urlcount"></span></div><div id="m-urls"></div><div class="m-actions" style="margin-top:12px"><button id="m-add" type="button">URLを追加</button></div><p class="m-sub" style="margin-top:10px">サイトはURLから判定。同じサイトの別検索も追加できます。</p></section>
<section class="m-conditions" aria-label="全サイト共通の追加条件"><div><h3>共通フィルター</h3><p class="m-sub">この計測の全URLに適用・すべて任意</p></div><div class="m-pair"><label>最低価格（円）<input id="m-min" type="number" min="0" placeholder="制限なし"></label><label>最高価格（円）<input id="m-max" type="number" min="0" value="80000" placeholder="制限なし"></label></div><label>必須語（すべて含む）<input id="m-required" value="iPhone 15" placeholder="語句はカンマで区切る"></label><label>除外語（いずれかを含む）<input id="m-exclude" value="ジャンク" placeholder="語句はカンマで区切る"></label><div><span>個別出品除外</span><div id="m-exclusions" class="m-sub">指定なし</div></div><p class="m-sub">URLで取得した範囲に適用します。条件を緩めてもURLの検索範囲は広がりません。</p></section>
</div>
<section aria-label="取得プレビュー"><div class="m-heading"><h3>プレビュー</h3><button id="m-preview" type="button">サンプルを再評価</button></div><div class="m-flow" id="m-summary" aria-live="polite"></div><div id="m-results"></div></section>
</div>
<footer><div class="m-actions"><button id="m-save" class="m-primary" type="button">この内容で計測を開始</button><span id="m-message" class="m-sub" aria-live="polite">実際の保存・クロールは行いません。</span></div></footer>
</div>
<script>
(()=>{
const root=document.getElementById('measurement-mock');
const q=id=>root.querySelector('#'+id);
const model={stacked:false};
let next=3;
let urls=[{id:1,url:'https://jp.mercari.com/search?keyword=iPhone%2015',enabled:true,failed:false},{id:2,url:'https://iosys.co.jp/items?q=iPhone15',enabled:true,failed:false}];
const excluded=new Set();
const samples=[{site:'mercari',id:'m101',name:'iPhone 15 128GB ブラック',price:68000,urlId:1},{site:'mercari',id:'m102',name:'iPhone 15 ジャンク',price:35000,urlId:1},{site:'mercari',id:'m103',name:'iPhone 15 256GB',price:92000,urlId:1},{site:'iosys',id:'i201',name:'iPhone 15 128GB Bランク',price:72800,urlId:2},{site:'iosys',id:'i202',name:'iPhone 14 128GB',price:49800,urlId:2}];
const names={mercari:'メルカリ',iosys:'イオシス',auction:'Yahoo!オークション',fleamarket:'Yahoo!フリマ'};
function classify(value){try{const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password||u.port)return {error:'HTTPSの対応URLを入力してください'};if(u.hostname==='jp.mercari.com'&&u.pathname==='/search')return {site:'mercari'};if(u.hostname==='iosys.co.jp'&&u.pathname==='/items')return {site:'iosys'};if(u.hostname==='auctions.yahoo.co.jp'&&u.pathname==='/search/search'){const a=u.searchParams.get('abatch');if(a==='3')return {site:'fleamarket'};if(a==='1,2')return {site:'auction'};return {error:'サービスを判別できません。検索条件を含むURLを貼り直してください'};}return {error:'このUI案では対応していないURLです'};}catch{return {error:value?'URLの形式を確認してください':'検索結果URLを入力してください'};}}
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;}
function button(label,fn){const b=text('button',label);b.type='button';b.onclick=fn;return b;}
function renderUrls(){q('m-urls').replaceChildren();urls.forEach(row=>{const c=classify(row.url);const wrap=text('div','', 'm-url');const top=text('div','', 'm-heading');top.append(text('span',c.site?names[c.site]:'URLを確認', 'm-pill'));top.append(button('削除',()=>{urls=urls.filter(x=>x.id!==row.id);renderUrls();render();}));const input=document.createElement('input');input.value=row.url;input.setAttribute('aria-label','取得URL '+row.id);input.placeholder='https://…';input.onchange=()=>{row.url=input.value;row.failed=false;renderUrls();render();};const actions=text('div','', 'm-row');actions.append(button(row.enabled?'停止する':'有効にする',()=>{row.enabled=!row.enabled;renderUrls();render();}));if(c.site&&row.enabled)actions.append(button(row.failed?'再試行':'失敗時の表示を見る',()=>{row.failed=!row.failed;renderUrls();render();}));wrap.append(top,input,text('div',c.error||(row.enabled?(row.failed?'取得失敗・最終成功データは保持':'対応・検索一覧'):'停止'),c.error||row.failed?'m-error':'m-sub'),actions);q('m-urls').append(wrap);});q('m-urlcount').textContent=urls.length+'件';}
function words(v){return v.split(/[,、]/).map(x=>x.trim().toLowerCase()).filter(Boolean);}
function render(){const min=q('m-min').value,max=q('m-max').value;const invalid=(min!==''&&+min<0)||(max!==''&&+max<0)||(min!==''&&max!==''&&+min>+max);const required=words(q('m-required').value),bad=words(q('m-exclude').value);const active=urls.filter(u=>u.enabled&&!classify(u.url).error);const failed=active.some(u=>u.failed);const data=samples.filter(s=>active.some(u=>u.id===s.urlId&&classify(u.url).site===s.site));let accepted=0;q('m-results').replaceChildren();data.forEach(s=>{const key=s.site+':'+s.id;const n=s.name.toLowerCase();let reason=excluded.has(key)?'個別出品除外':min!==''&&s.price<+min?'最低価格未満':max!==''&&s.price>+max?'最高価格超過':required.some(w=>!n.includes(w))?'必須語に不一致':bad.some(w=>n.includes(w))?'除外語に一致':'';if(!reason)accepted++;const item=text('div','', 'm-result');item.append(text('div',s.name),text('div',names[s.site]+' / '+s.price.toLocaleString()+'円 / '+(reason?'不採用：'+reason:'採用'),reason?'m-sub':''));item.append(button(excluded.has(key)?'除外を取り消す':'この計測から除外',()=>{excluded.has(key)?excluded.delete(key):excluded.add(key);render();}));q('m-results').append(item);});q('m-summary').textContent=invalid?'価格帯を確認してください':(failed?'一部失敗・保持済みサンプルで表示 / ':'')+'候補 '+data.length+'件 → 共通条件 → 採用 '+accepted+'件';if(!data.length)q('m-results').append(text('p','対象URLのサンプルはありません。実取得は行いません。','m-sub'));q('m-exclusions').replaceChildren();if(!excluded.size)q('m-exclusions').append(text('span','指定なし'));excluded.forEach(k=>q('m-exclusions').append(text('div',k)));q('m-save').disabled=invalid||!active.length||urls.some(u=>u.enabled&&classify(u.url).error);q('m-layout').style.gridTemplateColumns=model.stacked?'1fr':'';}
q('m-add').onclick=()=>{urls.push({id:next++,url:'',enabled:true,failed:false});renderUrls();render();};['m-min','m-max','m-required','m-exclude'].forEach(id=>q(id).addEventListener('input',render));q('m-preview').onclick=render;q('m-save').onclick=()=>{q('m-message').textContent='UI案での確認完了。実際の登録・クロールは行っていません。';};renderUrls();render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(model,'stacked',{label:'共通条件をURLの下に配置'});}
})();
</script>

x-oidc-client: &oidc-client
  OIDC_CLIENT_ID: "price-monitoring-development"
  OIDC_CLIENT_SECRET: "price-monitoring-development-secret"
  OIDC_REDIRECT_URI: "https://dev.price-monitoring.com/auth/auth_provider/callback"

x-backend: &backend
  build:
    context: .
    dockerfile: containers/backend/Dockerfile
  env_file: .env
  environment: &backend-environment
    DB_HOST_NAME: "backend-db"
    DB_DATABASE_NAME: "rails"
    DB_USER_NAME: "root"
    DB_PASSWORD: ""
    REDIS_URL: "redis://backend-redis:6379"
    PLAYWRIGHT_URL: "ws://backend-playwright:8888/ws"
    CAMOUFOX_URL: "ws://backend-camoufox:8890/ws"
    ALLOWED_ORIGINS: "nginx,backend,dev.price-monitoring.com"
  stdin_open: true
  tty: true
  depends_on:
    backend-db:
      condition: service_healthy
    backend-redis:
      condition: service_healthy
  volumes:
    - ./volumes/backend:/app
    - backend-bundle:/usr/local/bundle
    # TODO: esbuildなどでnpmパッケージが必要になったタイミングで有効化
    # - backend-node-modules:/app/node_modules

x-mysql: &mysql
  image: mysql/mysql-server:8.0
  healthcheck:
    test: ["CMD", "mysqladmin", "ping"]
    interval: 5s
    timeout: 5s
    retries: 5
  environment:
    MYSQL_ROOT_HOST: "%"
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
  stdin_open: true
  tty: true

x-redis: &redis
  image: "redis:latest"
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 5s
    retries: 5

services:
  frontend:
    build:
      context: .
      dockerfile: containers/frontend/Dockerfile
    environment:
      NEXT_PRIVATE_API_URL: "http://backend:3000"
    stdin_open: true
    tty: true
    volumes:
      - ./volumes/frontend:/app

  backend:
    <<: *backend
    environment:
      <<: [*backend-environment, *oidc-client]
      OIDC_ISSUER: "https://dev.auth-provider.com"

  backend-batch-1:
    <<: *backend
    command: bundle exec sidekiq -C config/sidekiq/crawl_process.yml

  backend-batch-2:
    <<: *backend
    command: bundle exec sidekiq -C config/sidekiq/general_process.yml

  backend-batch-3:
    <<: *backend
    command: bundle exec sidekiq -C config/sidekiq/crawl_process_2.yml

  backend-db:
    <<: *mysql
    volumes:
      - backend-db:/var/lib/mysql

  backend-redis:
    <<: *redis
    volumes:
      - "backend-redis:/data"
    command: --appendonly yes

  backend-playwright:
    build:
      context: .
      dockerfile: containers/backend_playwright/Dockerfile

  backend-camoufox:
    build:
      context: .
      dockerfile: containers/backend_camoufox/Dockerfile

  auth-provider:
    build:
      context: .
      dockerfile: containers/auth-provider/Dockerfile
    env_file:
      - path: ./volumes/auth-provider/.env
        required: false
    environment:
      <<: *oidc-client
      DB_HOST_NAME: "auth-provider-db"
      DB_DATABASE_NAME: "rails"
      DB_USER_NAME: "root"
      DB_PASSWORD: ""
      REDIS_URL: "redis://auth-provider-redis:6379"
      ALLOWED_ORIGINS: "nginx,dev.auth-provider.com"
      DOMAIN_NAME: "dev.auth-provider.com"
    stdin_open: true
    tty: true
    depends_on:
      auth-provider-db:
        condition: service_healthy
      auth-provider-redis:
        condition: service_healthy
    volumes:
      - ./volumes/auth-provider:/app
      - auth-provider-bundle:/usr/local/bundle

  auth-provider-db:
    <<: *mysql
    volumes:
      - auth-provider-db:/var/lib/mysql

  auth-provider-redis:
    <<: *redis
    volumes:
      - auth-provider-redis:/data
    command: --appendonly yes

  nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:443:443"
    environment:
      # nginx が listen するポート。公式イメージが起動時に templates へ埋め込む。worktree では WORKTREE_HTTPS_PORT で上書きする
      NGINX_HTTPS_PORT: "443"
    volumes:
      - ./volumes/nginx/templates:/etc/nginx/templates:ro
      - ./volumes/nginx/certs:/etc/nginx/certs:ro
      - ./volumes/nginx/includes:/etc/nginx/includes:ro
    depends_on:
      - backend
      - frontend
      - auth-provider
    restart: unless-stopped
    networks:
      default:
        aliases:
          - dev.auth-provider.com

volumes:
  backend-bundle:
  backend-db:
  backend-redis:
  auth-provider-bundle:
  auth-provider-db:
  auth-provider-redis:

# メインと同時に起動するための上書き。ブラウザの Cookie はポートで区別されないので、Cookie 名にポートを付けてセッションを分ける。ホストに公開するのは nginx の WORKTREE_HTTPS_PORT だけにして、メインのポートと衝突させない
services:
  backend:
    environment:
      OIDC_ISSUER: "https://dev.auth-provider.com:${WORKTREE_HTTPS_PORT}"
      OIDC_REDIRECT_URI: &worktree-redirect-uri "https://dev.price-monitoring.com:${WORKTREE_HTTPS_PORT}/auth/auth_provider/callback"
      SESSION_COOKIE_SUFFIX: "_${WORKTREE_HTTPS_PORT}"

  auth-provider:
    environment:
      DOMAIN_NAME: "dev.auth-provider.com:${WORKTREE_HTTPS_PORT}"
      OIDC_REDIRECT_URI: *worktree-redirect-uri
      SESSION_COOKIE_SUFFIX: "_${WORKTREE_HTTPS_PORT}"

  nginx:
    ports: !override
      - "127.0.0.1:${WORKTREE_HTTPS_PORT}:${WORKTREE_HTTPS_PORT}"
    environment:
      NGINX_HTTPS_PORT: ${WORKTREE_HTTPS_PORT:?worktree の .env に WORKTREE_HTTPS_PORT を設定する}

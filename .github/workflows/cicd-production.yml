name: CI/CD (Production)

concurrency: production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      backend_ci: ${{ steps.filter.outputs.backend_ci }}
      backend_cd: ${{ steps.filter.outputs.backend_cd }}
      backend_playwright_cd: ${{ steps.filter.outputs.backend_playwright_cd }}
      backend_camoufox_cd: ${{ steps.filter.outputs.backend_camoufox_cd }}
      frontend_ci: ${{ steps.filter.outputs.frontend_ci }}
      frontend_cd: ${{ steps.filter.outputs.frontend_cd }}
      auth_provider_ci: ${{ steps.filter.outputs.auth_provider_ci }}
      auth_provider_cd: ${{ steps.filter.outputs.auth_provider_cd }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: master
          filters: |
            backend_ci:
              - './volumes/backend/**'
              - './containers/backend/**'
            backend_cd:
              - './volumes/backend/!(spec)/**'
              - './containers/backend/**'
            backend_playwright_cd:
              - './containers/backend_playwright/**'
            backend_camoufox_cd:
              - './containers/backend_camoufox/**'
            auth_provider_ci:
              - './volumes/auth-provider/**'
              - './containers/auth-provider/**'
            auth_provider_cd:
              - './volumes/auth-provider/!(spec)/**'
              - './containers/auth-provider/**'
            frontend_ci:
              - './volumes/frontend/**'
              - './containers/frontend/**'
              - './docker-compose.yml'
              - './.github/workflows/cicd-production.yml'
            frontend_cd:
              - './volumes/frontend/**'
              - './containers/frontend/**'

  backend_ci:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.backend_ci == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    outputs:
      cd: ${{ needs.check_changes.outputs.backend_cd }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Execute CI
        run: |
          touch .env
          docker compose build backend
          docker compose run backend rails db:create
          docker compose run backend rails db:migrate
          docker compose run backend rspec

  backend_cd:
    needs: backend_ci
    if: ${{ needs.backend_ci.outputs.cd == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-cd.yml
    with:
      service_name: "k8s/manifests/price-monitoring"
      build_command: "make build-backend tag_suffix=${{ github.sha }} environment=production"
      apply_command: "make update-image ENV=production IMAGE=price-monitoring-backend tag_suffix=${{ github.sha }}"
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      GIT_COMMIT_USER: ${{ secrets.GIT_COMMIT_USER }}
      GIT_COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
      K8S_DEPLOY_KEY: ${{ secrets.K8S_DEPLOY_KEY }}

  backend_playwright_cd:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.backend_playwright_cd == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-cd.yml
    with:
      service_name: "k8s/manifests/price-monitoring"
      build_command: "make build-backend-playwright tag_suffix=${{ github.sha }} environment=production"
      apply_command: "make update-image ENV=production IMAGE=price-monitoring-backend-playwright tag_suffix=${{ github.sha }}"
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      GIT_COMMIT_USER: ${{ secrets.GIT_COMMIT_USER }}
      GIT_COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
      K8S_DEPLOY_KEY: ${{ secrets.K8S_DEPLOY_KEY }}

  backend_camoufox_cd:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.backend_camoufox_cd == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-cd.yml
    with:
      service_name: "k8s/manifests/price-monitoring"
      build_command: "make build-backend-camoufox tag_suffix=${{ github.sha }} environment=production"
      apply_command: "make update-image ENV=production IMAGE=price-monitoring-backend-camoufox tag_suffix=${{ github.sha }}"
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      GIT_COMMIT_USER: ${{ secrets.GIT_COMMIT_USER }}
      GIT_COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
      K8S_DEPLOY_KEY: ${{ secrets.K8S_DEPLOY_KEY }}

  frontend_ci:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.frontend_ci == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    outputs:
      cd: ${{ needs.check_changes.outputs.frontend_cd }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Execute Frontend CI
        run: |
          touch .env
          docker compose build frontend
          docker compose run --rm --no-deps frontend sh -c 'npm ci && npm run lint && npm run typecheck && npm test'

  frontend_cd:
    needs: frontend_ci
    if: ${{ needs.frontend_ci.outputs.cd == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-cd.yml
    with:
      service_name: "k8s/manifests/price-monitoring"
      build_command: "make build-frontend tag_suffix=${{ github.sha }} environment=production"
      apply_command: "make update-image ENV=production IMAGE=price-monitoring-frontend tag_suffix=${{ github.sha }}"
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      GIT_COMMIT_USER: ${{ secrets.GIT_COMMIT_USER }}
      GIT_COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
      K8S_DEPLOY_KEY: ${{ secrets.K8S_DEPLOY_KEY }}

  auth_provider_ci:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.auth_provider_ci == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    outputs:
      cd: ${{ needs.check_changes.outputs.auth_provider_cd }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Execute Auth Provider CI
        run: |
          touch .env
          openssl genrsa -out volumes/auth-provider/certs/private.pem 2048
          docker compose build auth-provider
          docker compose run --rm -e RAILS_ENV=test auth-provider sh -c 'bundle exec rails db:prepare && bundle exec rails tailwindcss:build && bundle exec rspec'

  auth_provider_cd:
    needs: auth_provider_ci
    if: ${{ needs.auth_provider_ci.outputs.cd == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-cd.yml
    with:
      service_name: "k8s/manifests/price-monitoring"
      build_command: "make build-auth-provider tag_suffix=${{ github.sha }} environment=production"
      apply_command: "make update-image ENV=production IMAGE=auth-provider-backend tag_suffix=${{ github.sha }}"
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      GIT_COMMIT_USER: ${{ secrets.GIT_COMMIT_USER }}
      GIT_COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
      K8S_DEPLOY_KEY: ${{ secrets.K8S_DEPLOY_KEY }}

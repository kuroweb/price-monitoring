name: Reusable CD

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      build_command:
        required: true
        type: string
      apply_command:
        required: true
        type: string
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID:
        required: true
      TAILSCALE_OAUTH_CLIENT_SECRET:
        required: true
      GIT_COMMIT_USER:
        required: true
      GIT_COMMIT_EMAIL:
        required: true
      K8S_DEPLOY_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # GHA キャッシュを書き出せる docker-container ドライバを使う
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # make から呼ぶ docker buildx が GHA キャッシュへアクセスできるようにランタイムのトークンを公開する
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build and Push Docker Image
        env:
          cache: "true"
          push: "true"
        run: ${{ inputs.build_command }}

      - name: Setup SSH for k8s Repository
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.K8S_DEPLOY_KEY }}

      # 複数のCDジョブが同時にk8sリポジトリへpushするため、拒否されたら最新を取り直してタグ更新からやり直す
      - name: Update Kubernetes Manifest
        run: |
          git config --global user.name "${{ secrets.GIT_COMMIT_USER }}"
          git config --global user.email "${{ secrets.GIT_COMMIT_EMAIL }}"
          git clone git@github.com:kuroweb/k8s.git
          cd ${{ inputs.service_name }}
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            ${{ inputs.apply_command }}
            make commit
            make push && exit 0
            echo "k8s manifest push failed (attempt ${attempt}/5)"
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          exit 1

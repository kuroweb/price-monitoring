name: Reusable CD

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      build_command:
        required: true
        type: string
      apply_command:
        required: true
        type: string
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID:
        required: true
      TAILSCALE_OAUTH_CLIENT_SECRET:
        required: true
      GIT_COMMIT_USER:
        required: true
      GIT_COMMIT_EMAIL:
        required: true
      K8S_DEPLOY_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # push がたまに遅く、Tailscale が DERP 中継になった回だけ遅いと見ているので、レジストリまでの経路をログに残して切り分ける
      # 直接接続なら via <宛先>、中継なら via DERP(<リージョン>) と出る。public リポジトリでログも公開されるため、宛先の IP:ポートは伏せる
      # 直接接続の確立には数秒かかり、回数が少ないと確立前の DERP 表示で終わって中継と読み違えるため、確立した時点で止まる前提で回数を多めにする
      # 直接接続にならないと tailscale ping は失敗で終わるが、経路の記録が目的なのでデプロイは止めない
      - name: Check Tailscale Route to Registry
        run: |
          (sudo tailscale ping -c 10 docker-registry.kuroweb.net 2>&1 || true) \
            | sed -E 's/([0-9]+\.){3}[0-9]+:[0-9]+|\[[0-9a-fA-F:]+\]:[0-9]+/<masked>/g'

      # GHA キャッシュを書き出せる docker-container ドライバを使う
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # make から呼ぶ docker buildx が GHA キャッシュへアクセスできるようにランタイムのトークンを公開する
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and Push Docker Image
        env:
          cache: "true"
          push: "true"
        run: ${{ inputs.build_command }}

      - name: Setup SSH for k8s Repository
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.K8S_DEPLOY_KEY }}

      # 複数のCDジョブが同時にk8sリポジトリへpushするため、拒否されたら最新を取り直してタグ更新からやり直す
      - name: Update Kubernetes Manifest
        run: |
          git config --global user.name "${{ secrets.GIT_COMMIT_USER }}"
          git config --global user.email "${{ secrets.GIT_COMMIT_EMAIL }}"
          git clone git@github.com:kuroweb/k8s.git
          cd ${{ inputs.service_name }}
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            ${{ inputs.apply_command }}
            make commit
            make push && exit 0
            echo "k8s manifest push failed (attempt ${attempt}/5)"
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          exit 1

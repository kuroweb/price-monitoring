name: Deploy All (Integration)

on:
  workflow_dispatch:

jobs:
  build_and_deploy_all:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Build All Docker Images
        run: |
          make build-backend tag_suffix=${{ github.sha }} environment=integration
          make build-backend-playwright tag_suffix=${{ github.sha }} environment=integration
          make build-backend-camoufox tag_suffix=${{ github.sha }} environment=integration
          make build-frontend tag_suffix=${{ github.sha }} environment=integration
          make build-auth-provider tag_suffix=${{ github.sha }} environment=integration

      - name: Push All Docker Images
        run: |
          make push-backend tag_suffix=${{ github.sha }} environment=integration
          make push-backend-playwright tag_suffix=${{ github.sha }} environment=integration
          make push-backend-camoufox tag_suffix=${{ github.sha }} environment=integration
          make push-frontend tag_suffix=${{ github.sha }} environment=integration
          make push-auth-provider tag_suffix=${{ github.sha }} environment=integration

      - name: Setup SSH for k8s Repository
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.K8S_DEPLOY_KEY }}

      - name: Update Kubernetes Manifests
        run: |
          git config --global user.name "${{ secrets.GIT_COMMIT_USER }}"
          git config --global user.email "${{ secrets.GIT_COMMIT_EMAIL }}"
          git clone git@github.com:kuroweb/k8s.git
          cd k8s/manifests/price-monitoring
          make update-images ENV=integration tag_suffix=${{ github.sha }}
          make commit
          make push

name: Claude Code Review

on:
  # push のたびに PR 全体をレビューすると重複した指摘が増えるため、自動は最初の 1 回に絞る。
  # 修正後の確認は issue_comment の `@claude review` で手動に呼ぶ。
  pull_request:
    types: [opened, ready_for_review, reopened]
    # 文書だけの変更はコードレビューの対象にしない。master に required check は無いため、スキップしてもマージは止まらない。
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  issue_comment:
    types: [created]

concurrency:
  # PR への無関係なコメントでも workflow は起動するため、レビュー対象外の run は run_id で別グループにし、実行中のレビューを止めない。
  group: claude-code-review-${{ (github.event_name == 'pull_request' || startsWith(github.event.comment.body, '@claude review')) && (github.event.pull_request.number || github.event.issue.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # `@claude review` は claude.yml の汎用応答から除外しているので、ここだけが反応する。
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.actor == 'kuroweb' || github.actor == 'dependabot[bot]')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.actor == 'kuroweb' && startsWith(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # issue_comment はデフォルトブランチで起動するため、PR の最新 head を明示して checkout する。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          fetch-depth: 1

      - name: Install review skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh skill install kuroweb/ai-manifest skills/gh-pr-review-ci --agent claude-code --scope user
          gh skill install kuroweb/ai-manifest skills/code-reviewing --agent claude-code --scope user

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          track_progress: true
          prompt: |
            gh-pr-review-ci --pr ${{ github.event.pull_request.number || github.event.issue.number }}
          claude_args: |
            --model sonnet
            --allowedTools "Read,Grep,Glob,Skill(gh-pr-review-ci),Skill(code-reviewing),Bash(gh repo view:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"

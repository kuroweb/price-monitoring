version: 2

updates:
  - package-ecosystem: bundler
    directory: /volumes/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Playwright のサーバーと同じ minor バージョンに保つ。
      - dependency-name: playwright-ruby-client
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /volumes/auth-provider
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      auth-provider-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /volumes/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

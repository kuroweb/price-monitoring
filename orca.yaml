scripts:
  setup: |
    # gitignore 対象の環境変数・鍵・証明書をメインのチェックアウトからコピーする
    for file in \
      .env \
      volumes/auth-provider/.env \
      volumes/auth-provider/certs/private.pem \
      volumes/nginx/certs/fullchain.pem \
      volumes/nginx/certs/privkey.pem \
      volumes/nginx/certs/auth-provider/fullchain.pem \
      volumes/nginx/certs/auth-provider/privkey.pem
    do
      if [ -f "$ORCA_ROOT_PATH/$file" ]; then
        mkdir -p "$(dirname "$ORCA_WORKTREE_PATH/$file")"
        cp "$ORCA_ROOT_PATH/$file" "$ORCA_WORKTREE_PATH/$file"
      fi
    done

    # メインのチェックアウトと公開ポートが衝突しないよう worktree 用の Compose 設定を重ねる
    if ! grep -q '^COMPOSE_FILE=' "$ORCA_WORKTREE_PATH/.env" 2>/dev/null; then
      printf '\nCOMPOSE_FILE=docker-compose.yml:docker-compose.worktree.yml\n' >> "$ORCA_WORKTREE_PATH/.env"
    fi

# コピー完了後にエージェントを起動する
setupAgentStartupPolicy: wait-for-setup

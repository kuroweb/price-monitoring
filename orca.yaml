scripts:
  setup: |
    # gitignore されているので、メインのチェックアウトからコピーする
    for file in \
      .env \
      volumes/auth-provider/.env \
      volumes/auth-provider/certs/private.pem \
      volumes/nginx/certs/fullchain.pem \
      volumes/nginx/certs/privkey.pem \
      volumes/nginx/certs/auth-provider/fullchain.pem \
      volumes/nginx/certs/auth-provider/privkey.pem
    do
      # worktree で変えた鍵や設定を、再実行で消さない
      if [ -f "$ORCA_WORKTREE_PATH/$file" ]; then
        continue
      fi
      if [ -f "$ORCA_ROOT_PATH/$file" ]; then
        mkdir -p "$(dirname "$ORCA_WORKTREE_PATH/$file")"
        cp "$ORCA_ROOT_PATH/$file" "$ORCA_WORKTREE_PATH/$file"
      fi
    done

    # node_modules も gitignore されているので、メインからコピーする
    modules=volumes/frontend/node_modules
    if [ ! -d "$ORCA_WORKTREE_PATH/$modules" ] && [ -d "$ORCA_ROOT_PATH/$modules" ]; then
      cp -Rc "$ORCA_ROOT_PATH/$modules" "$ORCA_WORKTREE_PATH/$modules"
    fi

    # コピーした COMPOSE_PROJECT_NAME が残るとメインの環境を操作するので消す。COMPOSE_FILE は worktree 用の上書きを読む値に書き直す
    env_file="$ORCA_WORKTREE_PATH/.env"
    touch "$env_file"
    env_tmp=$(mktemp "$env_file.XXXXXX")
    awk '!/^[[:space:]]*(export[[:space:]]+)?COMPOSE_(FILE|PROJECT_NAME)[[:space:]]*=/' "$env_file" > "$env_tmp"
    printf 'COMPOSE_FILE=docker-compose.yml:docker-compose.worktree.yml\n' >> "$env_tmp"
    mv "$env_tmp" "$env_file"

    # 他アプリの使用中ポートは見ない。他 worktree の .env にある番号だけを避ける
    if ! grep -Eq '^[[:space:]]*(export[[:space:]]+)?WORKTREE_HTTPS_PORT[[:space:]]*=' "$ORCA_WORKTREE_PATH/.env" 2>/dev/null; then
      used_ports=$(git -C "$ORCA_ROOT_PATH" worktree list --porcelain | sed -n 's/^worktree //p' | while read -r path; do
        sed -nE "s/^[[:space:]]*(export[[:space:]]+)?WORKTREE_HTTPS_PORT[[:space:]]*=[[:space:]]*[\"']?([0-9]+)[\"']?[[:space:]]*(#.*)?$/\\2/p" "$path/.env" 2>/dev/null
      done)
      port=8443
      while printf '%s\n' "$used_ports" | grep -qx "$port"; do
        port=$((port + 1))
      done
      printf 'WORKTREE_HTTPS_PORT=%s\n' "$port" >> "$ORCA_WORKTREE_PATH/.env"
    fi

setupAgentStartupPolicy: wait-for-setup
